# --- Install Nginx
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

# --- Remove default config
- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

# --- Main config
- name: Template nginx.conf
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
  notify: reload nginx

# --- Default proxy config (placeholder)
- name: Template default proxy site
  template:
    src: proxy_default.conf.j2
    dest: /etc/nginx/sites-available/monitoring.conf
    mode: "0644"
  notify: reload nginx

- name: Enable monitoring site
  file:
    src: /etc/nginx/sites-available/monitoring.conf
    dest: /etc/nginx/sites-enabled/monitoring.conf
    state: link
  notify: reload nginx

# --- Service
- name: Start and enable Nginx
  systemd:
    name: nginx
    state: started
    enabled: yes
