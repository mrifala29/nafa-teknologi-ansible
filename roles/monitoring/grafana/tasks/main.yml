# --- Directories
- name: Create grafana dirs
  file:
    path: "{{ item }}"
    state: directory
    owner: 472
    group: 472
    mode: "0755"
  loop:
    - "{{ grafana_data_dir }}"
    - /opt/monitoring/grafana/provisioning/datasources
    - /opt/monitoring/grafana/provisioning/dashboards
    - /opt/monitoring/grafana/dashboards

# --- Provisioning: datasource
- name: Template grafana datasource
  template:
    src: datasource.yml.j2
    dest: /opt/monitoring/grafana/provisioning/datasources/prometheus.yml
    owner: 472
    group: 472
    mode: "0644"
  notify: restart grafana

# --- Provisioning: dashboard config
- name: Template grafana dashboard provisioning
  template:
    src: dashboard_provider.yml.j2
    dest: /opt/monitoring/grafana/provisioning/dashboards/provider.yml
    owner: 472
    group: 472
    mode: "0644"
  notify: restart grafana

# --- Dashboard JSON
- name: Copy custom dashboard
  copy:
    src: server_monitoring.json
    dest: /opt/monitoring/grafana/dashboards/server_monitoring.json
    owner: 472
    group: 472
    mode: "0644"
  notify: restart grafana

# --- Network
- name: Ensure monitoring network exists
  community.docker.docker_network:
    name: "{{ monitoring_network }}"
    state: present

# --- Container
- name: Run grafana container
  community.docker.docker_container:
    name: grafana
    image: "grafana/grafana:{{ grafana_version }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ monitoring_network }}"
    ports:
      - "{{ grafana_port }}:3000"
    volumes:
      - "{{ grafana_data_dir }}:/var/lib/grafana"
      - "/opt/monitoring/grafana/provisioning:/etc/grafana/provisioning"
      - "/opt/monitoring/grafana/dashboards:/var/lib/grafana/dashboards"
    env:
      GF_SECURITY_ADMIN_USER: "{{ grafana_admin_user }}"
      GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
